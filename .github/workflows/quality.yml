name: Quality and security checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend and data safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run lint:js

      - name: Run unit and browser integration tests
        run: npm test

      - name: Build the production assets
        run: npm run build

      # There are no production runtime packages, but keep this check here so
      # a future dependency cannot be introduced with a known high-severity
      # vulnerability without the build going red.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
